executor: slurm
jobs: 10
printshellcmds: true
use-apptainer: true
apptainer-args: "-B /export/nfs0home/saumille/resonex -B /DFS-L/DATA/whiteson/saumille" # for nvidia use later --nv -B /srv/"
retries: 2

# greenplanet: 16 CPUS, 22 GB  and parition has 11 nodes

default-resources: # for e.g. 1 CPU, few GB RAM, couple hours runtime
    slurm_partition: "atlas"
    mem_mb: 4000 
    runtime: 120

set-threads: 
    masscalc_postproc: 4
    bumpnet_smooth: 16
    bumpnet_generate_test: 16
    bumpnet_generate_cal: 16
    bumpnet_predict_smooth: 16 # set down to 8 if "many variants" run
    bumpnet_predict_cal_smooth: 16 # set down to 8 if "many variants" run
    bumpnet_predict_bumpnet: 6

set-resources:
    masscalc_postproc:
        runtime: "attempt * 30"
        mem_mb: "min(attempt * 8000, 22000)"
    bumpnet_smooth:
        runtime: "attempt * 60"
        mem_mb: "min(attempt * 8000, 22000)"
    bumpnet_generate_test:
        runtime: "attempt * 60"
        mem_mb: "min(attempt * 8000, 22000)"
    bumpnet_generate_cal:
        runtime: "attempt * 60"
        mem_mb: "min(attempt * 8000, 22000)"
    bumpnet_predict_smooth: # IF RUN WITH GPR SET TO 360 INSTEAD OF 120
        runtime: "attempt * 120"
        mem_mb: "min(attempt * 8000, 22000)"
    bumpnet_predict_cal_smooth: # IF RUN WITH GPR SET TO 360 INSTEAD OF 120
        runtime: "attempt * 120"
        mem_mb: "min(attempt * 8000, 22000)"
    bumpnet_predict_bumpnet:
        runtime: "attempt * 30"
        mem_mb: "min(attempt * 8000, 22000)"
